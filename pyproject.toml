[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fetal-anatomy-prior"
version = "0.1.0"
description = "Anatomical-prior post-processing for fetal ultrasound structure detection"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.0", "scikit-learn==1.7.2", "PyYAML==6.0.2", "Pillow==11.0.0"]

[project.optional-dependencies]
detector = ["ultralytics==8.4.113", "matplotlib==3.10.0"]

[tool.setuptools.packages.find]
where = ["src"]
